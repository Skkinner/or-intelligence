server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Video uploads for Live analysis (the API allows up to 1 GB).
    client_max_body_size 1024m;

    # Same origin for the browser, so the sign-in cookie works.
    # Docker's DNS: look the API container up again when it restarts (it gets a new address).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_request_buffering off;
    }

    # React router: unknown paths load the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
